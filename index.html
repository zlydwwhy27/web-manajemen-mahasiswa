<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Academic Terpadu</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f4f7fc;
color:#1f2937;
}

/* LOGIN */

.login-page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(
135deg,
#2563eb,
#0ea5e9
);
}

.login-box{
width:420px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

.login-box h1{
text-align:center;
margin-bottom:20px;
color:#2563eb;
}

.login-box input{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #d1d5db;
border-radius:10px;
}

.login-btn,
.register-btn,
.back-btn{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.login-btn{
background:#2563eb;
color:white;
}

.register-btn{
background:#10b981;
color:white;
}

.back-btn{
background:#6b7280;
color:white;
}

/* DASHBOARD */

.dashboard{
display:none;
}

.navbar{
height:70px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 30px;
border-bottom:1px solid #e5e7eb;
}

.logo{
font-size:22px;
font-weight:bold;
color:#2563eb;
}

.right-menu{
display:flex;
gap:10px;
align-items:center;
}

.logout-btn{
background:red;
color:white;
border:none;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
}

.container{
padding:25px;
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.card h4{
color:#6b7280;
font-size:14px;
}

.card h1{
margin-top:10px;
font-size:32px;
}

.main-grid{
display:grid;
grid-template-columns:3fr 1fr;
gap:20px;
}

.table-box{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.table-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.action-group{
display:flex;
gap:10px;
flex-wrap:wrap;
}

.btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:14px;
}

.primary{
background:#2563eb;
color:white;
}

.success{
background:#10b981;
color:white;
}

.warning{
background:#f59e0b;
color:white;
}

.search-box{
margin-top:15px;
margin-bottom:15px;
}

.search-box input{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:10px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f3f4f6;
padding:12px;
text-align:left;
}

td{
padding:12px;
border-bottom:1px solid #e5e7eb;
}

.status-active{
background:#dcfce7;
color:#166534;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.status-cuti{
background:#fef3c7;
color:#92400e;
padding:5px 10px;
border-radius:20px;
font-size:12px;
}

.edit-btn{
background:#3b82f6;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.delete-btn{
background:red;
color:white;
border:none;
padding:8px 12px;
border-radius:8px;
cursor:pointer;
}

.side-panel{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.side-panel h3{
margin-bottom:15px;
}

.side-panel input,
.side-panel select{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #d1d5db;
border-radius:10px;
}

.side-panel button{
width:100%;
margin-top:12px;
padding:12px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
cursor:pointer;
}

.upload-box{
margin-top:20px;
padding:30px;
border:2px dashed #cbd5e1;
text-align:center;
border-radius:10px;
}

@media(max-width:900px){

.main-grid{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<!-- LOGIN -->

<div class="login-page" id="loginPage">

<div class="login-box" id="loginBox">

<h1>🎓 Login Sistem</h1>

<input type="text"
id="username"
placeholder="Username">

<input type="password"
id="password"
placeholder="Password">

<button
class="login-btn"
onclick="login()">
Login
</button>

<button
class="register-btn"
onclick="showRegister()">
Buat Akun
</button>

</div>

<div
class="login-box"
id="registerBox"
style="display:none;">

<h1>📝 Register</h1>

<input
type="text"
id="regUser"
placeholder="Username">

<input
type="password"
id="regPass"
placeholder="Password">

<button
class="register-btn"
onclick="register()">
Daftar
</button>

<button
class="back-btn"
onclick="showLogin()">
Kembali
</button>

</div>

</div>
<!-- DASHBOARD -->

<div class="dashboard" id="dashboard">

<div class="navbar">

<div class="logo">
🎓 Dashboard Academic Terpadu
</div>

<div class="right-menu">

<span id="clock"></span>

<button
class="logout-btn"
onclick="logout()">
Log out
</button>

</div>

</div>

<div class="container">

<!-- STATISTIK -->

<div class="stats">

<div class="card">
<h4>TOTAL MAHASISWA</h4>
<h1 id="totalMahasiswa">0</h1>
<p>Data terdaftar</p>
</div>

<div class="card">
<h4>RATA-RATA IPK</h4>
<h1 id="rataIpk">0</h1>
<p>IPK seluruh mahasiswa</p>
</div>

<div class="card">
<h4>STATUS AKTIF</h4>
<h1 id="aktifCount">0</h1>
<p>Mahasiswa aktif</p>
</div>

<div class="card">
<h4>CUTI / KELUAR</h4>
<h1 id="cutiCount">0</h1>
<p>Mahasiswa nonaktif</p>
</div>

</div>

<!-- GRID -->

<div class="main-grid">

<!-- TABEL -->

<div class="table-box">

<div class="table-header">

<h2>Data Mahasiswa</h2>

<div class="action-group">

<button
class="btn warning"
onclick="bubbleSortNIM()">
Bubble Sort NIM ↑
</button>

<button
class="btn warning"
onclick="bubbleSortIPK()">
Bubble Sort IPK ↑
</button>

<button
class="btn success"
onclick="selectionSortNIM()">
Selection Sort NIM ↑
</button>

<button
class="btn success"
onclick="selectionSortIPK()">
Selection Sort IPK ↑
</button>

<button
class="btn primary"
onclick="exportCSV()">
Export CSV
</button>

</div>

</div>

<div class="search-box">

<input
type="text"
id="search"
placeholder="Cari nama atau NIM..."
onkeyup="cariData()">

</div>

<table>

<thead>

<tr>

<th>NIM</th>
<th>Nama Lengkap</th>
<th>Email</th>
<th>Jurusan</th>
<th>IPK</th>
<th>Status</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tableMahasiswa">

</tbody>

</table>

</div>

<!-- PANEL KANAN -->

<div class="side-panel">

<h3>Tambah Mahasiswa</h3>

<input
type="text"
id="nim"
placeholder="NIM">

<input
type="text"
id="nama"
placeholder="Nama Mahasiswa">

<input
type="email"
id="email"
placeholder="Email Mahasiswa">

<input
type="text"
id="jurusan"
placeholder="Jurusan">

<input
type="number"
id="ipk"
step="0.01"
placeholder="IPK">

<select id="status">

<option value="Aktif">
Aktif
</option>

<option value="Cuti">
Cuti
</option>

<option value="Keluar">
Keluar
</option>

</select>

<button onclick="simpanData()">
Simpan Data
</button>

<div class="upload-box">

<h4>Import CSV</h4>

<input
type="file"
id="csvFile"
accept=".csv">

<button
onclick="importCSV()">
Proses CSV
</button>

</div>

</div>

</div>

</div>

</div>
<script>

let mahasiswa =
JSON.parse(
localStorage.getItem("mahasiswa")
) || [];

let editIndex = -1;

/* LOGIN */

function showRegister(){

document.getElementById("loginBox")
.style.display="none";

document.getElementById("registerBox")
.style.display="block";

}

function showLogin(){

document.getElementById("registerBox")
.style.display="none";

document.getElementById("loginBox")
.style.display="block";

}

function register(){

let user =
document.getElementById("regUser").value;

let pass =
document.getElementById("regPass").value;

if(!user || !pass){

alert("Lengkapi data");
return;

}

localStorage.setItem(
"akunUser",
user
);

localStorage.setItem(
"akunPass",
pass
);

alert("Akun berhasil dibuat");

showLogin();

}

function login(){

let user =
document.getElementById("username").value;

let pass =
document.getElementById("password").value;

if(
user === localStorage.getItem("akunUser")
&&
pass === localStorage.getItem("akunPass")
){

document.getElementById("loginPage")
.style.display="none";

document.getElementById("dashboard")
.style.display="block";

tampilData();

}else{

alert("Username atau Password salah");

}

}

function logout(){

document.getElementById("dashboard")
.style.display="none";

document.getElementById("loginPage")
.style.display="flex";

}

/* CRUD */

function simpanData(){

let nim =
document.getElementById("nim").value;

let nama =
document.getElementById("nama").value;

let email =
document.getElementById("email").value;

let jurusan =
document.getElementById("jurusan").value;

let ipk =
document.getElementById("ipk").value;

let status =
document.getElementById("status").value;

if(
!nim ||
!nama ||
!email ||
!jurusan ||
!ipk
){

alert("Lengkapi data");
return;

}

let data = {
nim,
nama,
email,
jurusan,
ipk,
status
};

if(editIndex === -1){

mahasiswa.push(data);

}else{

mahasiswa[editIndex] = data;
editIndex = -1;

}

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

bersihkanForm();
tampilData();

}

function bersihkanForm(){

nim.value="";
nama.value="";
email.value="";
jurusan.value="";
ipk.value="";

}

function tampilData(){

let tbody =
document.getElementById(
"tableMahasiswa"
);

tbody.innerHTML="";

let totalIPK = 0;
let aktif = 0;
let cuti = 0;

mahasiswa.forEach((mhs,index)=>{

totalIPK +=
parseFloat(mhs.ipk);

if(mhs.status==="Aktif"){

aktif++;

}else{

cuti++;

}

tbody.innerHTML += `

<tr>

<td>${mhs.nim}</td>

<td>${mhs.nama}</td>

<td>
<a href="https://mail.google.com/mail/?view=cm&fs=1&to=${mhs.email}"
target="_blank"
style="color:#2563eb;text-decoration:none;">
<i class="fa-solid fa-envelope"></i>
${mhs.email}
</a>
</td>

<td>${mhs.jurusan}</td>

<td>${mhs.ipk}</td>

<td>

<span class="${
mhs.status==="Aktif"
?
'status-active'
:
'status-cuti'
}">

${mhs.status}

</span>

</td>

<td>

<button
class="edit-btn"
onclick="editData(${index})">
Edit
</button>

<button
class="delete-btn"
onclick="hapusData(${index})">
Hapus
</button>

</td>

</tr>

`;

});

document.getElementById(
"totalMahasiswa"
).innerHTML =
mahasiswa.length;

document.getElementById(
"aktifCount"
).innerHTML =
aktif;

document.getElementById(
"cutiCount"
).innerHTML =
cuti;

let rata =
mahasiswa.length > 0
?
(totalIPK /
mahasiswa.length).toFixed(2)
:
0;

document.getElementById(
"rataIpk"
).innerHTML =
rata;

}

function editData(index){

nim.value =
mahasiswa[index].nim;

nama.value =
mahasiswa[index].nama;

email.value =
mahasiswa[index].email;

jurusan.value =
mahasiswa[index].jurusan;

ipk.value =
mahasiswa[index].ipk;

status.value =
mahasiswa[index].status;

editIndex=index;

}

function hapusData(index){

if(confirm(
"Hapus data mahasiswa?"
)){

mahasiswa.splice(index,1);

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

}

}
/* BUBBLE SORT NIM */

function bubbleSortNIM(){

for(let i=0;i<mahasiswa.length-1;i++){

for(let j=0;j<mahasiswa.length-i-1;j++){

if(
mahasiswa[j].nim >
mahasiswa[j+1].nim
){

let temp =
mahasiswa[j];

mahasiswa[j] =
mahasiswa[j+1];

mahasiswa[j+1] =
temp;

}

}

}

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

}

/* BUBBLE SORT IPK */

function bubbleSortIPK(){

for(let i=0;i<mahasiswa.length-1;i++){

for(let j=0;j<mahasiswa.length-i-1;j++){

if(
parseFloat(mahasiswa[j].ipk)
<
parseFloat(mahasiswa[j+1].ipk)
){

let temp =
mahasiswa[j];

mahasiswa[j] =
mahasiswa[j+1];

mahasiswa[j+1] =
temp;

}

}

}

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

}

/* SELECTION SORT NIM */

function selectionSortNIM(){

for(let i=0;i<mahasiswa.length-1;i++){

let min = i;

for(
let j=i+1;
j<mahasiswa.length;
j++
){

if(
mahasiswa[j].nim <
mahasiswa[min].nim
){

min=j;

}

}

let temp =
mahasiswa[i];

mahasiswa[i] =
mahasiswa[min];

mahasiswa[min] =
temp;

}

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

}

/* SELECTION SORT IPK */

function selectionSortIPK(){

for(let i=0;i<mahasiswa.length-1;i++){

let max=i;

for(
let j=i+1;
j<mahasiswa.length;
j++
){

if(
parseFloat(mahasiswa[j].ipk)
>
parseFloat(mahasiswa[max].ipk)
){

max=j;

}

}

let temp =
mahasiswa[i];

mahasiswa[i] =
mahasiswa[max];

mahasiswa[max] =
temp;

}

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

}

/* SEARCH */

function cariData(){

let keyword =
document
.getElementById("search")
.value
.toLowerCase();

let rows =
document.querySelectorAll(
"#tableMahasiswa tr"
);

rows.forEach(row=>{

row.style.display =
row.innerText
.toLowerCase()
.includes(keyword)
?
""
:
"none";

});

}

/* EXPORT CSV */

function exportCSV(){

let csv =
"NIM,NAMA,EMAIL,JURUSAN,IPK,STATUS\n";

mahasiswa.forEach(m=>{

csv +=
`${m.nim},${m.nama},${m.email},${m.jurusan},${m.ipk},${m.status}\n`;

});

let blob =
new Blob(
[csv],
{type:'text/csv'}
);

let link =
document.createElement("a");

link.href =
URL.createObjectURL(blob);

link.download =
"mahasiswa.csv";

link.click();

}

/* IMPORT CSV */

function importCSV(){

let file =
document.getElementById(
"csvFile"
).files[0];

if(!file){

alert("Pilih file CSV");
return;

}

let reader =
new FileReader();

reader.onload =
function(e){

let rows =
e.target.result
.split("\n");

rows.shift();

rows.forEach(row=>{

let data =
row.split(",");

if(data.length >= 6){

mahasiswa.push({

nim:data[0],
nama:data[1],
email:data[2],
jurusan:data[3],
ipk:data[4],
status:data[5]

});

}

});

localStorage.setItem(
"mahasiswa",
JSON.stringify(mahasiswa)
);

tampilData();

};

reader.readAsText(file);

}

/* JAM */

setInterval(()=>{

document.getElementById(
"clock"
).innerHTML =
new Date()
.toLocaleString("id-ID");

},1000);

/* LOAD */

window.onload=()=>{

tampilData();

};

</script>

</body>
</html>
